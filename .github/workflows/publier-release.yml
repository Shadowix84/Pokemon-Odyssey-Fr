# Publier une release en un clic : onglet Actions → « Publier une release » → Run workflow → taper la version (ex. FR4.1.6).
# Les fichiers doivent déjà être dans le dépôt :
#   publication/<VERSION>/<NOM>_patch_<VERSION>.bps   (le patch)
#   publication/<VERSION>/release.md                  (le texte de la release)
# Les issues étiquetées « corrigé – prochaine version » sont ajoutées à la rubrique « Corrigé » de la release,
# puis fermées avec le message « Corrigé dans <VERSION> » et le lien du patch (message 3).
# Facultatif : README.md, CHANGELOG.md, CONTRIBUTING.md dans le même dossier -> copiés à la racine
# du dépôt au moment de la publication, pour que la page d'accueil et la release changent ensemble.
name: Publier une release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. FR4.1.6)"
        required: true
        type: string

permissions:
  contents: write
  issues: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier la version et les fichiers
        id: verif
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^FR[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version invalide : « $VERSION ». Format attendu : FR4.1.6 (FR collé au numéro)."
            exit 1
          fi
          DOSSIER="publication/$VERSION"
          if [ ! -d "$DOSSIER" ]; then
            echo "::error::Le dossier $DOSSIER n'existe pas encore : demande d'abord « Mets à jour le GitHub » à Claude (il y dépose le patch et le texte de la release), puis relance."
            exit 1
          fi
          PATCH=$(ls "$DOSSIER"/*_patch_"$VERSION".bps 2>/dev/null | head -n 1 || true)
          if [ -z "$PATCH" ]; then
            echo "::error::Patch introuvable : $DOSSIER/<NOM>_patch_$VERSION.bps"
            exit 1
          fi
          if [ ! -s "$DOSSIER/release.md" ]; then
            echo "::error::Texte de release introuvable : $DOSSIER/release.md"
            exit 1
          fi
          if gh release view "$VERSION" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::La release ou le tag $VERSION existe déjà : un tag ne se réutilise jamais."
            exit 1
          fi
          NOM=$(basename "$PATCH" | sed "s/_patch_$VERSION\.bps$//")
          echo "patch=$PATCH" >> "$GITHUB_OUTPUT"
          echo "titre=$NOM $VERSION" >> "$GITHUB_OUTPUT"
          echo "notes=$DOSSIER/release.md" >> "$GITHUB_OUTPUT"

      - name: Mettre à jour le README (et le journal) en même temps
        id: maj
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          COPIES=()
          for f in README.md CHANGELOG.md CONTRIBUTING.md; do
            if [ -f "publication/$VERSION/$f" ]; then cp "publication/$VERSION/$f" "$f"; COPIES+=("$f"); fi
          done
          if [ ${#COPIES[@]} -gt 0 ] && [ -n "$(git status --porcelain -- "${COPIES[@]}")" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add -- "${COPIES[@]}"
            git commit -m "Publication $VERSION : README et journal des modifications"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "Fichiers du dépôt mis à jour pour $VERSION" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Lister les issues corrigées dans la release
        id: issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NOTES: ${{ steps.verif.outputs.notes }}
        run: |
          set -euo pipefail
          gh api -X GET "repos/$REPO/issues" -f state=open -f labels="corrigé – prochaine version" -f per_page=100 \
            --jq '.[] | select(.pull_request == null) | "\(.number)\t\(.title)"' > corrigees.tsv
          cp "$NOTES" notes.md
          python3 - <<'PY'
          lignes = [l.rstrip('\n').split('\t', 1) for l in open('corrigees.tsv', encoding='utf-8') if l.strip()]
          notes = open('notes.md', encoding='utf-8').read()
          if lignes and '### Corrigé' not in notes:
              bloc = '### Corrigé\n\n' + '\n'.join('- #%s %s' % (n, t) for n, t in lignes) + '\n\n'
              for repere in ('### Rappel', '### Ce qui reste'):
                  if repere in notes:
                      notes = notes.replace(repere, bloc + repere, 1); break
              else:
                  notes = notes.rstrip() + '\n\n' + bloc
          open('notes.md', 'w', encoding='utf-8').write(notes)
          PY
          echo "nombre=$(grep -c . corrigees.tsv || true)" >> "$GITHUB_OUTPUT"

      - name: Créer la release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" "${{ steps.verif.outputs.patch }}" \
            --title "${{ steps.verif.outputs.titre }}" \
            --notes-file notes.md \
            --target "${{ steps.maj.outputs.sha }}" \
            --latest
          echo "### Release publiée : ${{ steps.verif.outputs.titre }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ github.server_url }}/${{ github.repository }}/releases/tag/$VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Fermer les issues corrigées
        if: steps.issues.outputs.nombre != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          URL="${{ github.server_url }}/$REPO/releases/tag/$VERSION"
          while IFS=$'\t' read -r NUM TITRE; do
            [ -z "$NUM" ] && continue
            printf '🎉 **Corrigé dans %s** : c’est en ligne !\n\nTélécharge le nouveau patch ici : %s\n\nMerci pour ton signalement !\n\n*Message automatique*\n' "$VERSION" "$URL" > msg.md
            gh api "repos/$REPO/issues/$NUM/comments" -F body=@msg.md > /dev/null
            gh api -X PATCH "repos/$REPO/issues/$NUM" -f state=closed -f state_reason=completed > /dev/null
            echo "- #$NUM fermée" >> "$GITHUB_STEP_SUMMARY"
          done < corrigees.tsv
